spring:
  application:
    name: backend

  datasource:
    url: jdbc:h2:mem:backdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create

    show-sql: true
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: profile, email

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379

openai:
  api-key: ${OPENAI_API_KEY}
  embedding-model: text-embedding-3-small

jwt:
  secret: ${JWT_SECRET}
  access-token-expiry: 3600000
  refresh-token-expiry: 604800000

r2:
  account-id: ${R2_ACCOUNT_ID}
  access-key: ${R2_ACCESS_KEY}
  secret-key: ${R2_SECRET_KEY}
  bucket: ${R2_BUCKET}
  public-base-url: ${R2_PUBLIC_BASE_URL}

app:
  frontend-url: http://localhost
  frontend-new-user-url: http://localhost/change/nickname
  frontend-dashboard-url: http://localhost/dashboard