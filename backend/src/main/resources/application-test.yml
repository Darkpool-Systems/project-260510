spring:
  application:
    name: backend

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id
            client-secret: test-client-secret
            scope: profile, email

jwt:
  secret: test-secret-key-for-junit-testing-only-do-not-use-in-production
  access-token-expiry: 3600000
  refresh-token-expiry: 604800000

openai:
  api-key: test-dummy-key
  embedding-model: text-embedding-3-small

app:
  frontend-url: http://localhost
  frontend-new-user-url: http://localhost/change/nickname
  frontend-dashboard-url: http://localhost/dashboard
